name: Student course checks
on:
  push:
    paths:
      - '*.md'
      - 'maintenance/**'
      - 'class-*/**'
      - 'student-lessons/**'
      - '.gitattributes'
      - '.github/workflows/course-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  student-download:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Check student downloads, local experiment, and contribution workflow
        run: python maintenance/ci_student_smoke.py
